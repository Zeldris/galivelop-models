[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "galivelop-models"
version = "0.1.0"
description = "Model Atlas: which variant of which local AI model fits on this machine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[tool.setuptools.packages.find]
include = ["gmod*", "gart*"]

[tool.setuptools.package-data]
gmod = ["schemas/*.json"]
